<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Фиолетовый фон -->
  <rect width="400" height="400" fill="#B87BE0" rx="0" />
  
  <!-- Соединения между узлами (граф) -->
  <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Верхний левый -> Верхний правый -->
    <line x1="140" y1="90" x2="260" y2="90" />
    <!-- Верхний левый -> Средний левый -->
    <line x1="140" y1="90" x2="110" y2="180" />
    <!-- Верхний левый -> Средний правый -->
    <line x1="140" y1="90" x2="260" y2="190" />
    <!-- Верхний левый -> Нижний -->
    <line x1="140" y1="90" x2="200" y2="260" />
    
    <!-- Верхний правый -> Средний левый -->
    <line x1="260" y1="90" x2="110" y2="180" />
    <!-- Верхний правый -> Средний правый -->
    <line x1="260" y1="90" x2="260" y2="190" />
    <!-- Верхний правый -> Нижний -->
    <line x1="260" y1="90" x2="200" y2="260" />
    
    <!-- Средний левый -> Средний правый -->
    <line x1="110" y1="180" x2="260" y2="190" />
    <!-- Средний левый -> Нижний -->
    <line x1="110" y1="180" x2="200" y2="260" />
    
    <!-- Средний правый -> Нижний -->
    <line x1="260" y1="190" x2="200" y2="260" />
  </g>
  
  <!-- Узлы (круги) -->
  <g fill="#FFFFFF">
    <!-- Верхний левый -->
    <circle cx="140" cy="90" r="32" />
    <!-- Верхний правый -->
    <circle cx="260" cy="90" r="32" />
    <!-- Средний левый -->
    <circle cx="110" cy="180" r="32" />
    <!-- Средний правый -->
    <circle cx="260" cy="190" r="32" />
    <!-- Нижний центральный -->
    <circle cx="200" cy="260" r="32" />
  </g>
  
  <!-- Текст COMFY UI -->
  <text x="200" y="350" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="400" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">COMFY UI</text>
</svg>